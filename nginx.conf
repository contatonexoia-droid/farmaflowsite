server {
    listen 80;
    server_name farmaflow.site www.farmaflow.site _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento ultrarrápido
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        image/x-icon;

    # Tipo MIME correto para Web App Manifest
    types {
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    # Arquivos de SEO e Ícones na raiz (sem redirecionamento SPA, sempre acessíveis pelo Googlebot)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /site.webmanifest {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Cache longo para assets com hash gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cache para imagens e logos da pasta public
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Roteamento SPA (React)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
